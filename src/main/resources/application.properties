# Secrets are NOT stored here. They come from environment variables,
# or from a local .env file in the project root (ignored by Git).
# See .env.example for the full list.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hisync}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=NAMED_ENUM

# YouTube
youtube.api.key=${YOUTUBE_API_KEY:}

# Cloudinary
cloudinary.cloud-name=dmxxaqbn5
cloudinary.upload-preset=hisync_recordings

# Mail (OTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
# JWT_SECRET must be at least 32 characters long.
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
